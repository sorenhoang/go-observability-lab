# Single-binary Tempo: one process, local disk storage, no object store —
# same "keep the lab trivial, swap for a real backend later" pattern as
# Loki's filesystem store in Phase 10.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Metrics-generator: Tempo derives RED-style metrics and a service graph
# directly from spans, remote-written into Prometheus. This is a second,
# independent way to get request-rate/latency numbers — from traces this
# time, not from the app's own middleware (Phase 2) or Loki's log lines
# (Phase 10) — which is the trust-building exercise Phase 12 leans on.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: ["span-metrics", "service-graphs"]

usage_report:
  reporting_enabled: false
