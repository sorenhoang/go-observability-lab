apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      # Turns an exemplar's trace_id field into a "View trace" link on the
      # datasource itself — no per-dashboard wiring needed.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
