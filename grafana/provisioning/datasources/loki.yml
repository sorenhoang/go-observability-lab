apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Turns the trace_id field already present in every canonical request
      # line (Phase 9's obs.NewHandler injects it from context) into a
      # clickable link to the matching trace in Tempo. When the target
      # datasource is a tracing backend, Grafana treats the captured group
      # as the trace ID directly — no real URL template needed.
      derivedFields:
        - name: TraceID
          matcherRegex: "\"trace_id\":\"(\\w+)\""
          url: "${__value.raw}"
          datasourceUid: tempo
