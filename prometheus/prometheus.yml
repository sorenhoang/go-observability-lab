global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: api
    static_configs:
      - targets:
          - app:8080

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: consumer
    static_configs:
      - targets:
          - consumer:9002

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "container_(network_tcp_usage_total|tasks_state|fs_.*|blkio_.*)"
        action: drop
      - source_labels: [container_label_com_docker_compose_service]
        regex: "^$"
        action: drop
