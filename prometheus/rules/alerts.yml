groups:
  - name: api_alerts
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API target is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for over 1m."

      - alert: HighErrorRate
        expr: job:http_error_rate:ratio5m > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx error ratio above 5%"
          description: "Error ratio is {{ $value | humanizePercentage }} (threshold 5%) for 5m."

      - alert: HighLatencyP95
        expr: job:http_request_duration_seconds:p95_5m > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency above 1s"
          description: "P95 is {{ $value | humanizeDuration }} (threshold 1s) for 10m."

      - alert: OrderConsumerLagging
        expr: sum(kafka_consumergroup_lag{consumergroup="order-processors"}) > 500
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Order consumer group lag over 500"
          description: "Lag is {{ $value }} for 3m - the async order pipeline is falling behind."

      - alert: HostDiskFillingUp
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/host"}[1h], 4*3600) < 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host data disk projected to fill within 4h"
